<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Mistlake fonts and rendering, managed by the catos-niri-mistlake Profile.
     UI: Inter + Noto Sans CJK SC. Code: Maple Mono NF + Noto Sans Mono CJK SC.
     Grayscale antialiasing and slight hinting suit the fractional 1.25 scale. -->
<fontconfig>
  <!-- Put our families at the very front. Plain <prefer> aliases would land
       behind earlier ones (wqy-zenhei's 44-*.conf), so prepend_first is used. -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Inter Variable</string>
      <string>Inter</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Noto Serif</string>
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Maple Mono NF</string>
      <string>Noto Sans Mono CJK SC</string>
    </edit>
  </match>

  <!-- Han text falls back from Inter (no CJK glyphs) to Noto Sans CJK SC, so
       Simplified Chinese forms win over the JP/KR variants of the same file. -->

  <!-- Rendering: grayscale AA (subpixel fringes under fractional scaling),
       slight hinting (vertical only, keeps glyph shapes), no embedded bitmaps. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
