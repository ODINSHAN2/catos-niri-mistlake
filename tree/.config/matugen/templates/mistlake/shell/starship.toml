# Generated by matugen from the catos-niri-mistlake Profile. Edit the template
# in ~/.config/matugen/templates/mistlake/shell/starship.toml instead.
"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
format = """
$username$hostname$directory$git_branch$git_state$git_status\
$python$nodejs$rust$golang$c$java$conda$nix_shell\
$line_break$character"""
right_format = "$cmd_duration$status$jobs$time"

[username]
style_user = "{{colors.secondary.default.hex}}"
style_root = "bold {{colors.error.default.hex}}"
format = "[$user]($style)"

[hostname]
style = "{{colors.secondary.default.hex}}"
format = "[@$hostname]($style) "

[directory]
style = "bold {{colors.primary.default.hex}}"
repo_root_style = "bold {{colors.primary.default.hex}}"
read_only = " 󰌾"
read_only_style = "{{colors.tertiary.default.hex}}"
truncation_length = 4
truncate_to_repo = true
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "{{colors.secondary.default.hex}}"
format = "[$symbol$branch]($style) "

[git_state]
style = "{{colors.tertiary.default.hex}}"
format = "[$state( $progress_current/$progress_total)]($style) "

[git_status]
style = "{{colors.tertiary.default.hex}}"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "≠"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
untracked = "?"
stashed = "≡"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[python]
symbol = " "
style = "{{colors.on_surface_variant.default.hex}}"
format = "[$symbol$version( $virtualenv)]($style) "

[nodejs]
symbol = " "
style = "{{colors.on_surface_variant.default.hex}}"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "{{colors.on_surface_variant.default.hex}}"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "{{colors.on_surface_variant.default.hex}}"
format = "[$symbol$version]($style) "

[c]
symbol = " "
style = "{{colors.on_surface_variant.default.hex}}"
format = "[$symbol$version]($style) "

[java]
symbol = " "
style = "{{colors.on_surface_variant.default.hex}}"
format = "[$symbol$version]($style) "

[conda]
symbol = " "
style = "{{colors.on_surface_variant.default.hex}}"
format = "[$symbol$environment]($style) "

[nix_shell]
symbol = " "
style = "{{colors.on_surface_variant.default.hex}}"
format = "[$symbol$state]($style) "

[character]
success_symbol = "[❯]({{colors.primary.default.hex}})"
error_symbol = "[❯]({{colors.error.default.hex}})"
vimcmd_symbol = "[❮]({{colors.secondary.default.hex}})"

[cmd_duration]
min_time = 2000
style = "{{colors.outline.default.hex}}"
format = "[ $duration]($style) "

[status]
disabled = false
symbol = "✗ "
style = "{{colors.error.default.hex}}"
format = "[$symbol$status]($style) "

[jobs]
symbol = "✦"
style = "{{colors.tertiary.default.hex}}"
format = "[$symbol$number]($style) "

[time]
disabled = false
time_format = "%H:%M"
style = "{{colors.outline.default.hex}}"
format = "[$time]($style)"
