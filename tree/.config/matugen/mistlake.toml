# Mistlake matugen templates. mistlake-apply splices this file into
# ~/.config/matugen/config.toml between the "mistlake" markers, because that
# file is a catdot seed (yours after the first activation) and DMS reads its
# user templates from there.
# fcitx5-remote -r does not reload the classicui addon, so the hook asks
# fcitx5 over D-Bus to reload classicui, which re-reads the skin.
[templates.mistlake_fcitx5_panel]
input_path = '~/.config/matugen/templates/mistlake/fcitx5/panel.svg'
output_path = '~/.local/share/fcitx5/themes/Mistlake/panel.svg'

[templates.mistlake_fcitx5_highlight]
input_path = '~/.config/matugen/templates/mistlake/fcitx5/highlight.svg'
output_path = '~/.local/share/fcitx5/themes/Mistlake/highlight.svg'

[templates.mistlake_fcitx5_theme]
input_path = '~/.config/matugen/templates/mistlake/fcitx5/theme.conf'
output_path = '~/.local/share/fcitx5/themes/Mistlake/theme.conf'
post_hook = 'busctl --user call org.fcitx.Fcitx5 /controller org.fcitx.Fcitx.Controller1 ReloadAddonConfig s classicui >/dev/null 2>&1 || true'

[templates.mistlake_gtk3]
input_path = '~/.config/matugen/templates/mistlake/gtk/mistlake.css'
output_path = '~/.config/gtk-3.0/mistlake.css'

[templates.mistlake_gtk4]
input_path = '~/.config/matugen/templates/mistlake/gtk/mistlake.css'
output_path = '~/.config/gtk-4.0/mistlake.css'

[templates.mistlake_starship]
input_path = '~/.config/matugen/templates/mistlake/shell/starship.toml'
output_path = '~/.config/starship/mistlake.toml'

[templates.mistlake_fish]
input_path = '~/.config/matugen/templates/mistlake/shell/colors.fish'
output_path = '~/.config/fish/mistlake-colors.fish'

[templates.mistlake_fastfetch]
input_path = '~/.config/matugen/templates/mistlake/shell/fastfetch.jsonc'
output_path = '~/.config/fastfetch/config.jsonc'
