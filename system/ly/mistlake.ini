# Mistlake appearance for ly (1.4.x). mistlake-system writes only these keys
# into /etc/ly/config.ini; session, auto-login and PAM settings stay as they
# are. Colors are 0xSSRRGGBB: SS is the style byte (01 = bold).
bg = 0x000a1013
fg = 0x00dce8ea
border_fg = 0x005ec8d8
error_fg = 0x01f2a59b
full_color = true
animation = colormix
animation_frame_delay = 8
colormix_col1 = 0x000f4a54
colormix_col2 = 0x0024443a
colormix_col3 = 0x200a1013
bigclock = en
bigclock_12hr = false
bigclock_seconds = false
box_title = mistlake
margin_box_h = 3
margin_box_v = 1
input_len = 30
